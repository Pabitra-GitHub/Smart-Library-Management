<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Smart Library - Futuristic Digital Library Management System with Natural Language Smart Search" />
  <title>AI Smart Library - Futuristic Library Management</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <div id="app">
    <!-- Floating Glass Pill Top Navigation -->
    <div class="navbar-floating-container" id="navbar-container" style="display: none;">
      <header class="navbar-pill" id="main-navbar">
        <a href="#" class="nav-brand" onclick="state.setTab(state.currentUser?.role === 'librarian' ? 'dashboard' : 'my-portal'); return false;" title="AI Smart Library Home">
          <div class="brand-icon">📚</div>
          <span class="brand-title">AI Smart Library</span>
        </a>

        <!-- Role-Based Navigation Links -->
        <nav class="navbar-nav">
          <ul class="nav-links" id="nav-links-container">
            <!-- Populated dynamically by app.js -->
          </ul>
        </nav>

        <!-- User Profile & Action Tools -->
        <div class="nav-actions" id="nav-user-container">
          <!-- Populated dynamically by app.js -->
        </div>
      </header>
    </div>

    <!-- Main View Dynamic Container -->
    <main class="main-content" id="view-container">
      <!-- Views rendered dynamically (Auth, Librarian, Books, Students, Issues, Portal, SmartSearch) -->
    </main>

    <!-- Native Accessible Dialog Modals (Modern Web Guidance Compliant) -->
    <dialog id="book-dialog" closedby="any" aria-label="Book Management Dialog"></dialog>
    <dialog id="student-dialog" closedby="any" aria-label="Student Profile Dialog"></dialog>
    <dialog id="issue-dialog" closedby="any" aria-label="Issue Transaction Dialog"></dialog>
    <dialog id="return-dialog" closedby="any" aria-label="Return Book Dialog"></dialog>
    <dialog id="settings-dialog" closedby="any" aria-label="Library Settings Dialog"></dialog>

    <!-- Global Toast Notifications Container -->
    <div id="toast-container" aria-live="polite"></div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/views/authView.js"></script>
  <script src="js/views/librarianView.js"></script>
  <script src="js/views/booksView.js"></script>
  <script src="js/views/studentsView.js"></script>
  <script src="js/views/issuesView.js"></script>
  <script src="js/views/studentPortal.js"></script>
  <script src="js/views/smartSearchView.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
